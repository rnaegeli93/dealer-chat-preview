<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Response Path Preview</title>

  <script>
    const companyId = sessionStorage.getItem("companyId");
    const dataSettings = sessionStorage.getItem("dataSettings");

    if (!companyId || !dataSettings) {
      window.location.replace("index.html");
    } else {
      const safeCompanyId = encodeURIComponent(companyId);

      document.write(
        '<script ' +
          'id="path-widget-tag" ' +
          'src="https://ep.chatpath.com/widget.js?companyId=' +
          safeCompanyId +
          '" ' +
          'async ' +
          'data-company="' +
          companyId.replace(/"/g, "&quot;") +
          '" ' +
          'data-settings="' +
          dataSettings.replace(/"/g, "&quot;") +
          '">' +
        '<\/script>'
      );
    }
  </script>
</head>

<body>
</body>
</html>
