<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Path Test</title>

    <script>
        const params = new URLSearchParams(window.location.search);

        const companyId = params.get("companyId");
        const dataSettings = params.get("dataSettings");
        const website = params.get("website");

        const chatScript = document.createElement("script");

        chatScript.id = "path-widget-tag";
        chatScript.src =
            "https://ep.chatpath.com/widget.js?companyId=" + companyId;

        chatScript.async = true;
        chatScript.setAttribute("data-company", companyId);
        chatScript.setAttribute("data-settings", dataSettings);

        document.head.appendChild(chatScript);
    </script>

</head>

<body>

    <h1>Response Path Test</h1>

    <p>
        If the widget is functioning correctly, the chat should appear in the
        lower-right corner of this page.
    </p>

    <p>
        <strong>Company ID:</strong>
        <span id="companyIdValue"></span>
    </p>

    <p>
        <strong>Data Settings:</strong>
        <span id="dataSettingsValue"></span>
    </p>

    <p>
        <strong>Website:</strong>
        <span id="websiteValue"></span>
    </p>

    <script>
        document.getElementById("companyIdValue").textContent =
            companyId;

        document.getElementById("dataSettingsValue").textContent =
            dataSettings;

        document.getElementById("websiteValue").textContent =
            website;
    </script>

</body>
</html>
