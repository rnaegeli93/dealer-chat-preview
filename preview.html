<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Response Path Preview</title>

    <script>
        const params = new URLSearchParams(window.location.search);

        const companyId = params.get("companyId");
        const dataSettings = params.get("dataSettings");
        const website = params.get("website");

        if (!companyId || !dataSettings) {
            window.location.href = "index.html";
        } else {
            const widgetScript = document.createElement("script");

            widgetScript.id = "path-widget-tag";

            widgetScript.src =
                "https://ep.chatpath.com/widget.js?companyId=" +
                encodeURIComponent(companyId);

            widgetScript.async = true;

            widgetScript.setAttribute(
                "data-company",
                companyId
            );

            widgetScript.setAttribute(
                "data-settings",
                dataSettings
            );

            document.head.appendChild(widgetScript);
        }
    </script>
</head>

<body>

    <h1>Response Path Preview</h1>

    <p>
        If the widget is functioning correctly, the chat should appear in the
        lower-right corner of this page.
    </p>

    <hr>

    <p>
        Company ID:
        <strong id="companyIdDisplay"></strong>
    </p>

    <p>
        Data Settings:
        <strong id="dataSettingsDisplay"></strong>
    </p>

    <p>
        Website:
        <strong id="websiteDisplay"></strong>
    </p>

    <p>
        <a href="index.html">Edit Preview</a>
    </p>

    <script>
        document.getElementById("companyIdDisplay").textContent =
            companyId || "Not provided";

        document.getElementById("dataSettingsDisplay").textContent =
            dataSettings || "Not provided";

        document.getElementById("websiteDisplay").textContent =
            website || "Not provided";
    </script>

</body>
</html>
