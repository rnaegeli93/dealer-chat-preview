<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Response Path Preview</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #websiteFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: white;
        }

        #status {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 999999;
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <iframe
        id="websiteFrame"
        title="Dealership website preview"
    ></iframe>

    <div id="status">
        Loading preview...
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const companyId = params.get("companyId");
        const webdeskId = params.get("webdeskId");
        let website = params.get("url") || params.get("website");

        if (
            website &&
            !website.startsWith("http://") &&
            !website.startsWith("https://")
        ) {
            website = "https://" + website;
        }

        const frame = document.getElementById("websiteFrame");
        const status = document.getElementById("status");

        if (website) {
            frame.src = website;

            frame.addEventListener("load", function () {
                status.style.display = "none";
            });
        } else {
            status.textContent = "No website URL was provided.";
        }

        if (!companyId || !webdeskId) {
            status.textContent =
                "Missing companyId or webdeskId.";
        } else {
            window.PathET = function () {
                return {
                    env: "production",
                    companyId: companyId,
                    webdeskId: webdeskId,
                    livepreview: true,
                    source: "website",
                    locations: []
                };
            };

            const previewBundle =
                document.createElement("script");

            previewBundle.id = "preview-bundle-tag";
            previewBundle.src =
                "https://ep.chatpath.com/bundle.js";

            document.body.appendChild(previewBundle);
        }
    </script>

</body>
</html>
