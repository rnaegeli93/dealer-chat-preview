<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Response Path Preview</title>
</head>

<body>

    <h1>Response Path Preview</h1>

    <p>
        The chat should appear in the lower-right corner.
    </p>

    <p>
        <strong>Company ID:</strong>
        <span id="companyIdDisplay"></span>
    </p>

    <p>
        <strong>Webdesk ID:</strong>
        <span id="webdeskIdDisplay"></span>
    </p>

    <p>
        <strong>Website:</strong>
        <span id="websiteDisplay"></span>
    </p>

    <script>
        const params = new URLSearchParams(window.location.search);

        const companyId = params.get("companyId");
        const webdeskId =
            params.get("webdeskId") ||
            params.get("dataSettings");

        const website =
            params.get("url") ||
            params.get("website");

        document.getElementById("companyIdDisplay").textContent =
            companyId || "Not provided";

        document.getElementById("webdeskIdDisplay").textContent =
            webdeskId || "Not provided";

        document.getElementById("websiteDisplay").textContent =
            website || "Not provided";

        if (!companyId || !webdeskId) {
            document.body.insertAdjacentHTML(
                "beforeend",
                "<p><strong>Missing companyId or webdeskId.</strong></p>"
            );
        } else {
            window.PathET = function () {
                return {
                    env: "production",
                    companyId: companyId,
                    webdeskId: webdeskId,
                    livepreview: true,
                    source: "website",
                    locations: []
                };
            };

            const previewBundle =
                document.createElement("script");

            previewBundle.id = "preview-bundle-tag";
            previewBundle.src =
                "https://ep.chatpath.com/bundle.js";

            document.body.appendChild(previewBundle);
        }
    </script>

</body>
</html>
