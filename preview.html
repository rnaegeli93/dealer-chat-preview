<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Response Path Preview</title>

  <script>
    const params = new URLSearchParams(window.location.search);

    const companyId = params.get("companyId");
    const dataSettings = params.get("dataSettings");

    if (!companyId || !dataSettings) {
      window.location.replace("index.html");
    } else {
      const safeCompanyId = companyId.replace(
        /[^a-zA-Z0-9_-]/g,
        ""
      );

      const safeDataSettings = dataSettings.replace(
        /[^a-zA-Z0-9_-]/g,
        ""
      );

      document.write(
        '<script ' +
          'id="path-widget-tag" ' +
          'src="https://ep.chatpath.com/widget.js?companyId=' +
          encodeURIComponent(safeCompanyId) +
          '" ' +
          'async ' +
          'data-company="' +
          safeCompanyId +
          '" ' +
          'data-settings="' +
          safeDataSettings +
          '">' +
        '<\/script>'
      );
    }
  </script>
</head>

<body>
  <h1>Response Path Preview</h1>

  <p>
    The Response Path chat should appear in the bottom-right corner.
  </p>

  <p>
    <a href="index.html">Edit Preview</a>
  </p>
</body>
</html>
