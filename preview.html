<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Path Test</title>

    <script>
        const params = new URLSearchParams(window.location.search);

        const companyId = params.get("companyId");
        const dataSettings = params.get("dataSettings");
        const website = params.get("website");

        document.write(`
            <script
                id="path-widget-tag"
                src="https://ep.chatpath.com/widget.js?companyId=${companyId}"
                async
                data-company="${companyId}"
                data-settings="${dataSettings}">
            <\/script>
        `);
    </script>

</head>

<body>

    <h1>Response Path Test</h1>

    <p>If the widget is functioning correctly, the chat should appear in the lower-right corner of this page.</p>

    <hr>

    <p><strong>Company ID:</strong> <span id="company"></span></p>
    <p><strong>Data Settings:</strong> <span id="settings"></span></p>
    <p><strong>Website:</strong> <span id="websiteValue"></span></p>

    <script>
        document.getElementById("company").textContent = companyId;
        document.getElementById("settings").textContent = dataSettings;
        document.getElementById("websiteValue").textContent = website;
    </script>

</body>
</html>
