<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Response Path Preview</title>

  <script>
    const companyId = sessionStorage.getItem("companyId");
    const dataSettings = sessionStorage.getItem("dataSettings");

    if (!companyId || !dataSettings) {
      window.location.replace("index.html");
    } else {
      const widgetScript = document.createElement("script");

      widgetScript.id = "path-widget-tag";

      widgetScript.src =
        "https://ep.chatpath.com/widget.js?companyId=" +
        encodeURIComponent(companyId);

      widgetScript.async = true;

      widgetScript.setAttribute(
        "data-company",
        companyId
      );

      widgetScript.setAttribute(
        "data-settings",
        dataSettings
      );

      document.head.appendChild(widgetScript);
    }
  </script>
</head>

<body>
  <h1>Response Path Preview</h1>

  <p>
    Company ID:
    <strong id="companyDisplay"></strong>
  </p>

  <p>
    Data Settings:
    <strong id="settingsDisplay"></strong>
  </p>

  <p id="widgetStatus">
    Loading Response Path chat...
  </p>

  <script>
    const companyDisplay =
      sessionStorage.getItem("companyId");

    const settingsDisplay =
      sessionStorage.getItem("dataSettings");

    document.getElementById(
      "companyDisplay"
    ).textContent = companyDisplay || "";

    document.getElementById(
      "settingsDisplay"
    ).textContent = settingsDisplay || "";

    const widgetTag =
      document.getElementById("path-widget-tag");

    if (widgetTag) {
      widgetTag.addEventListener("load", function () {
        document.getElementById(
          "widgetStatus"
        ).textContent =
          "Response Path script loaded.";
      });

      widgetTag.addEventListener("error", function () {
        document.getElementById(
          "widgetStatus"
        ).textContent =
          "The Response Path script could not be loaded.";
      });
    }
  </script>
</body>
</html>
