<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Path Preview</title>

    <script>
        (function () {

            // Retrieve values from the first page
            const companyId = sessionStorage.getItem("companyId");
            const dataSettings = sessionStorage.getItem("dataSettings");

            // If they're missing, go back to the setup page
            if (!companyId || !dataSettings) {
                window.location.href = "index.html";
                return;
            }

            // Create the Response Path script tag
            const widgetScript = document.createElement("script");

            widgetScript.id = "path-widget-tag";
            widgetScript.src =
                "https://ep.chatpath.com/widget.js?companyId=" +
                encodeURIComponent(companyId);

            widgetScript.async = true;

            widgetScript.setAttribute("data-company", companyId);
            widgetScript.setAttribute("data-settings", dataSettings);

            // Add it to the page's <head>
            document.head.appendChild(widgetScript);

        })();
    </script>

</head>

<body>

    <h2>Response Path Preview</h2>

    <p>
        Company ID:
        <strong id="companyDisplay"></strong>
    </p>

    <p>
        Data Settings:
        <strong id="settingsDisplay"></strong>
    </p>

    <script>
        document.getElementById("companyDisplay").textContent =
            sessionStorage.getItem("companyId");

        document.getElementById("settingsDisplay").textContent =
            sessionStorage.getItem("dataSettings");
    </script>

</body>
</html>
