<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Response Path Website Preview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #777;
      color: #666;
    }

    body.preview-active {
      overflow: hidden;
      background: white;
    }

    /* Preview setup screen */

    #setupScreen {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .preview-card {
      width: 100%;
      max-width: 660px;
      overflow: hidden;
      background: #f7f7f7;
      border-radius: 14px;
      border: 2px solid #888;
    }

    .preview-title {
      margin: 0;
      padding: 26px 20px;
      background: white;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #666;
    }

    .preview-content {
      padding: 0 22px 24px;
    }

    .section-heading {
      margin: 20px 0 22px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #666;
    }

    .website-section {
      padding: 18px 76px;
      background: white;
      border: 1px solid #e6e6e6;
    }

    .account-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .account-box {
      min-height: 130px;
      padding: 18px;
      background: white;
      border: 1px solid #e6e6e6;
      text-align: center;
    }

    .field-label {
      display: block;
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 700;
      color: #666;
    }

    .text-input {
      display: block;
      width: 100%;
      height: 41px;
      padding: 8px 12px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: white;
      color: #444;
      font-size: 18px;
      text-align: center;
    }

    .text-input:focus {
      border-color: #1998ff;
      outline: 1px solid #1998ff;
    }

    .text-input::placeholder {
      color: #999;
    }

    .small-input {
      max-width: 185px;
      margin: 0 auto;
    }

    .button-row {
      margin-top: 22px;
      text-align: center;
    }

    .preview-button {
      width: 218px;
      min-height: 44px;
      border: none;
      border-radius: 6px;
      background: #ff8234;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .preview-button:hover {
      background: #f27427;
    }

    .preview-button:focus {
      outline: 3px solid rgba(255, 130, 52, 0.35);
      outline-offset: 2px;
    }

    .instruction {
      max-width: 390px;
      margin: 12px auto 0;
      text-align: center;
      font-size: 14px;
      font-style: italic;
      line-height: 1.5;
      color: #777;
    }

    .error-message {
      display: none;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
      color: #b42318;
    }

    /* Website preview */

    #previewScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
    }

    #dealerFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .preview-toolbar {
      position: fixed;
      top: 14px;
      left: 50%;
      z-index: 10000;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
      transform: translateX(-50%);
    }

    .toolbar-button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
      color: #444;
      font-size: 14px;
      cursor: pointer;
    }

    .toolbar-button:hover {
      background: #f3f3f3;
    }

    @media (max-width: 620px) {
      #setupScreen {
        padding: 12px;
      }

      .preview-content {
        padding-right: 14px;
        padding-left: 14px;
      }

      .website-section {
        padding: 18px;
      }

      .account-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main id="setupScreen">

    <section class="preview-card">

        <h1 class="preview-title">
            See Response Path on Your Website
        </h1>

        <div class="preview-content">

            <p class="section-heading">
                Enter the website URL of the site you would like to preview:
            </p>

            <div class="website-section">

                <input
                    id="websiteUrl"
                    class="text-input"
                    type="text"
                    placeholder="your website (abc.com)"
                    autocomplete="off">

            </div>

            <p class="section-heading">
                Edit your Response Path account details below:
            </p>

            <div class="account-grid">

                <div class="account-box">

                    <label class="field-label">
                        Enter your RP Company ID
                    </label>

                    <input
                        id="companyId"
                        class="text-input small-input"
                        type="text"
                        value="p1512">

                </div>

                <div class="account-box">

                    <label class="field-label">
                        Enter your RP Data Settings
                    </label>

                    <input
                        id="dataSettings"
                        class="text-input small-input"
                        type="text"
                        value="5cb8d857d50d3300">

                </div>

            </div>

            <div class="button-row">

                <button
                    id="showPreviewButton"
                    class="preview-button"
                    type="button">

                    Show Preview

                </button>

            </div>

            <p class="instruction">
                Please use an incognito tab or clear your browser cookies
                to ensure the preview functions properly.
            </p>

            <p
                id="errorMessage"
                class="error-message"
                style="display:none;color:red;">
            </p>

        </div>

    </section>

</main>

<script>

const websiteInput = document.getElementById("websiteUrl");
const companyInput = document.getElementById("companyId");
const settingsInput = document.getElementById("dataSettings");

const previewButton = document.getElementById("showPreviewButton");
const errorMessage = document.getElementById("errorMessage");

function normalizeUrl(url){

    url = url.trim();

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){
        url = "https://" + url;
    }

    return url;

}

previewButton.addEventListener("click",function(){

    errorMessage.style.display = "none";

    const website = normalizeUrl(websiteInput.value);

    if(website === "https://"){

        errorMessage.innerText = "Please enter a website.";

        errorMessage.style.display = "block";

        return;

    }

    sessionStorage.setItem(
        "dealerWebsite",
        website
    );

    sessionStorage.setItem(
        "companyId",
        companyInput.value.trim()
    );

    sessionStorage.setItem(
        "dataSettings",
        settingsInput.value.trim()
    );

    window.location.href = "preview.html";

});

</script>

</body>
