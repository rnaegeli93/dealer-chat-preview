<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Response Path Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 560px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            margin-top: 0;
            margin-bottom: 24px;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0f55bb;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Response Path Preview</h1>

        <p>
            Enter the dealership website and Response Path account information.
        </p>

        <form id="previewForm">
            <label for="website">
                Dealership Website URL
            </label>

            <input
                type="text"
                id="website"
                name="website"
                placeholder="https://www.dealership.com"
                required
            >

            <label for="companyId">
                Company ID
            </label>

            <input
                type="text"
                id="companyId"
                name="companyId"
                placeholder="p1512"
                required
            >

            <label for="webdeskId">
                Webdesk ID
            </label>

            <input
                type="text"
                id="webdeskId"
                name="webdeskId"
                placeholder="5cb8d857d50d330012259c56"
                required
            >

            <button type="submit">
                Launch Preview
            </button>
        </form>
    </main>

    <script>
        document
            .getElementById("previewForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                const website = document
                    .getElementById("website")
                    .value
                    .trim();

                const companyId = document
                    .getElementById("companyId")
                    .value
                    .trim();

                const webdeskId = document
                    .getElementById("webdeskId")
                    .value
                    .trim();

                const params = new URLSearchParams({
                    url: website,
                    companyId: companyId,
                    webdeskId: webdeskId
                });

                window.location.href =
                    "preview.html?" + params.toString();
            });
    </script>

</body>
</html>
